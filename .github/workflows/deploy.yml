# main 에 푸시하면 GitHub Pages 로 배포한다.
#
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔줘야 한다.
# 주소는 https://<아이디>.github.io/<저장소 이름>/ 이 된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package.json 의 packageManager 필드에 적힌 yarn 버전을 그대로 쓴다
      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn build
        env:
          # 저장소 이름이 주소의 한 칸이 되므로 에셋 경로 앞에 붙여야 한다
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
